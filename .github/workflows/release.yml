name: Release

# The fork publishes canaries from `main` only. The `release` branch exists solely
# because semantic-release requires a stable branch; it must never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cd example && npx expo prebuild
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm trusted publishing (OIDC, via `id-token: write`) is preferred; a token is
          # only used when the NPM_TOKEN secret is set.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
